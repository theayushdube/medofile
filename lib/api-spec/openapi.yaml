openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Healthcare AI chatbot operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the healthcare AI chatbot (streaming SSE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream of chat tokens
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
  /doctors/register:
    post:
      operationId: registerDoctor
      tags: [doctors]
      summary: Register a doctor profile without requiring login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorProfileInput"
      responses:
        "201":
          description: Created doctor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "400":
          description: Required doctor details are missing
  /doctors/{id}/profile:
    put:
      operationId: updateDoctorProfile
      tags: [doctors]
      summary: Update a doctor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorProfileInput"
      responses:
        "200":
          description: Updated doctor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "404":
          description: Doctor not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
      required:
        - role
        - content
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        userLocation:
          type: string
          description: User's city/location for doctor recommendations
      required:
        - messages
    ChatError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DoctorProfileInput:
      type: object
      properties:
        name: { type: string }
        qualification: { type: string }
        specialization: { type: string }
        experience: { type: integer }
        fee: { type: integer }
        hospital: { type: string }
        clinicName: { type: string }
        address: { type: string }
        city: { type: string }
        phone: { type: string }
        about: { type: string }
        languages: { type: array, items: { type: string } }
        availability: { type: string }
        timing: { type: string }
        registrationNumber: { type: string }
        treatments: { type: array, items: { type: string } }
        consultationTypes: { type: array, items: { type: string } }
        socials: { type: object, additionalProperties: { type: string } }
      required: [name, specialization, city, phone]
    Doctor:
      allOf:
        - $ref: "#/components/schemas/DoctorProfileInput"
        - type: object
          properties:
            id: { type: integer }
          required: [id]
